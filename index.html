    <script>
      // El tema del aparato manda hasta que alguien toque el interruptor.
      // Se resuelve antes del primer pintado para que no haya destello.
      try {
        var saved = localStorage.getItem('tinta-nocturna');
        var night = saved === null ? !matchMedia('(prefers-color-scheme: light)').matches : saved !== '0';
        if (night) document.documentElement.classList.add('night-boot');
      } catch (e) {}
    </script>
